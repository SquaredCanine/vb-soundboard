<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VB Soundboard</title>
  <style>
    :root {
      --bg: #f4f4f7;
      --card: #ffffff;
      --text: #1d1d24;
      --muted: #6b6b78;
      --accent: #5b4bff;
      --accent-text: #ffffff;
      --border: #e2e2ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121217;
        --card: #1c1c24;
        --text: #ececf1;
        --muted: #9a9aa8;
        --accent: #7d70ff;
        --border: #2c2c38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 24px; }
    h2 { margin: 0 0 16px; font-size: 1.1rem; }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    #now-playing { color: var(--muted); margin: 0 0 16px; min-height: 1.4em; }
    .controls { display: flex; gap: 10px; }
    button {
      font: inherit;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.icon {
      width: 52px;
      height: 52px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    button.icon svg { width: 24px; height: 24px; fill: currentColor; }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    #progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    #progress[hidden] { display: none; }
    #seek-bar { flex: 1; accent-color: var(--accent); cursor: pointer; }
    #bits {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
  </style>
</head>
<body>
  <main>
    <h1>VB Soundboard</h1>

    <section>
      <h2>Songs</h2>
      <p id="now-playing">Press play for a random song</p>
      <div id="progress" hidden>
        <span id="current-time">0:00</span>
        <input id="seek-bar" type="range" min="0" value="0" step="0.1" aria-label="Song position">
        <span id="duration">0:00</span>
      </div>
      <div class="controls">
        <button id="play" class="primary icon" aria-label="Play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="pause" class="icon" aria-label="Pause" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="stop" class="icon" aria-label="Stop" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>
    </section>

    <section>
      <h2>Bits</h2>
      <div id="bits"></div>
    </section>
  </main>

  <script>
    const songPlayer = new Audio();
    const bitPlayer = new Audio();
    let songs = [];

    const playButton = document.getElementById("play");
    const pauseButton = document.getElementById("pause");
    const stopButton = document.getElementById("stop");
    const nowPlaying = document.getElementById("now-playing");
    const bitsContainer = document.getElementById("bits");

    function audioUrl(file) {
      return "/audio/" + encodeURIComponent(file.id);
    }

    function updateButtons() {
      const hasSong = songPlayer.src !== "";
      playButton.disabled = !songPlayer.paused;
      pauseButton.disabled = songPlayer.paused;
      stopButton.disabled = !hasSong;
    }

    function playRandomSong() {
      const song = songs[Math.floor(Math.random() * songs.length)];
      songPlayer.src = audioUrl(song);
      nowPlaying.textContent = "Now playing: " + song.name;
      songPlayer.play();
    }

    function stopSong() {
      songPlayer.pause();
      songPlayer.removeAttribute("src");
      songPlayer.load();
      nowPlaying.textContent = "Press play for a random song";
      updateButtons();
    }

    playButton.addEventListener("click", () => {
      const isPausedMidSong = songPlayer.src !== "";
      if (isPausedMidSong) {
        songPlayer.play();
      } else {
        playRandomSong();
      }
    });
    pauseButton.addEventListener("click", () => songPlayer.pause());
    stopButton.addEventListener("click", stopSong);

    songPlayer.addEventListener("play", updateButtons);
    songPlayer.addEventListener("pause", updateButtons);
    songPlayer.addEventListener("ended", stopSong);

    const progress = document.getElementById("progress");
    const seekBar = document.getElementById("seek-bar");
    const currentTimeLabel = document.getElementById("current-time");
    const durationLabel = document.getElementById("duration");

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, "0");
      return minutes + ":" + remainingSeconds;
    }

    songPlayer.addEventListener("loadedmetadata", () => {
      seekBar.max = songPlayer.duration;
      durationLabel.textContent = formatTime(songPlayer.duration);
      progress.hidden = false;
    });

    songPlayer.addEventListener("timeupdate", () => {
      seekBar.value = songPlayer.currentTime;
      currentTimeLabel.textContent = formatTime(songPlayer.currentTime);
    });

    seekBar.addEventListener("input", () => {
      songPlayer.currentTime = seekBar.value;
    });

    songPlayer.addEventListener("emptied", () => {
      progress.hidden = true;
      seekBar.value = 0;
      currentTimeLabel.textContent = "0:00";
    });

    function showBits(bits) {
      for (const bit of bits) {
        const button = document.createElement("button");
        button.textContent = bit.name;
        button.addEventListener("click", () => {
          bitPlayer.src = audioUrl(bit);
          bitPlayer.play();
        });
        bitsContainer.appendChild(button);
      }
    }

    async function loadLibrary() {
      const response = await fetch("/audio");
      const library = await response.json();
      songs = library.songs;
      showBits(library.bits);
    }

    loadLibrary();
  </script>
</body>
</html>
